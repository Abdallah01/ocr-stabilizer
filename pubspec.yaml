name: ocr_stabilizer
description: >-
  Real-time OCR overlay stabilization engine — drift correction,
  spatial indexing, block tracking, CJK-aware paragraph grouping.
  Pure Dart; Flutter-ready.
version: 2.1.0
homepage: https://github.com/Abdallah01/ocr-stabilizer
repository: https://github.com/Abdallah01/ocr-stabilizer
issue_tracker: https://github.com/Abdallah01/ocr-stabilizer/issues

topics:
  - ocr
  - overlay
  - tracking
  - slam
  - flutter

environment:
  sdk: ^3.3.0

dependencies:
  # @immutable / @visibleForTesting / @internal annotations. Was already a
  # direct dependency before the pure-Dart migration (#59); floor matches
  # the meta version pinned by Flutter 3.19.x, the package's previous
  # minimum supported Flutter.
  meta: ^1.11.0

dev_dependencies:
  # Core lint set replacing flutter_lints after the pure-Dart migration
  # (#59). flutter_lints layers Flutter-specific rules on top of this
  # same package, so the effective rule set for pure-Dart code is
  # unchanged.
  lints: ">=4.0.0 <7.0.0"
  # Replaces flutter_test (#59): the API surface the suite uses
  # (group/test/expect and core matchers) is identical.
  test: ^1.24.0
