name: ocr_stabilizer
description: >-
  Real-time OCR overlay stabilization engine — drift correction,
  spatial indexing, block tracking. Built for Flutter.
version: 0.6.1
homepage: https://github.com/Abdallah01/ocr-stabilizer
repository: https://github.com/Abdallah01/ocr-stabilizer
issue_tracker: https://github.com/Abdallah01/ocr-stabilizer/issues

topics:
  - ocr
  - overlay
  - tracking
  - slam
  - flutter

environment:
  sdk: ^3.3.0
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  # @internal annotation on BandFallbackStatsInternal (#53). Constraint
  # floor matches the meta version pinned by Flutter 3.19.x, the
  # package's minimum supported Flutter.
  meta: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Range resolves adaptively per SDK: 4.x on the package floor
  # (Dart ^3.3.0 / Flutter 3.19, where 5.x+ can't resolve), newest
  # available line elsewhere. Keep the lower bound at 4.0.0 so
  # contributors on the floor can `pub get`; Dependabot widens the
  # upper bound as new majors ship (#56, #63).
  flutter_lints: ">=4.0.0 <7.0.0"
