name: ocr_stabilizer
description: >-
  Real-time OCR overlay stabilization engine — drift correction,
  spatial indexing, block tracking. Built for Flutter.
version: 0.5.0
homepage: https://github.com/Abdallah01/ocr-stabilizer
repository: https://github.com/Abdallah01/ocr-stabilizer
issue_tracker: https://github.com/Abdallah01/ocr-stabilizer/issues

topics:
  - ocr
  - overlay
  - tracking
  - slam
  - flutter

environment:
  sdk: ^3.3.0
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  # flutter_lints 6.x requires Dart 3.8; pin to 5.x so dev-deps SDK floor
  # matches the package SDK floor (^3.3.0) — both downstream users and
  # contributors on older Flutter channels can `pub get` successfully.
  flutter_lints: ^5.0.0
