name: ocr_stabilizer
description: >-
  Real-time OCR overlay stabilization engine — drift correction,
  spatial indexing, block tracking. Built for Flutter.
version: 0.6.0
homepage: https://github.com/Abdallah01/ocr-stabilizer
repository: https://github.com/Abdallah01/ocr-stabilizer
issue_tracker: https://github.com/Abdallah01/ocr-stabilizer/issues

topics:
  - ocr
  - overlay
  - tracking
  - slam
  - flutter

environment:
  sdk: ^3.3.0
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  # @internal annotation on BandFallbackStatsInternal (#53). Constraint
  # floor matches the meta version pinned by Flutter 3.19.x, the
  # package's minimum supported Flutter.
  meta: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Pinned to the newest line that resolves on the package SDK floor
  # (^3.3.0): flutter_lints 5.x needs Dart 3.5 and 6.x needs 3.8, so
  # only 4.x lets contributors on Flutter 3.19 run `pub get`. (The 0.6.0
  # CI floor leg caught the previous ^5.0.0 pin violating exactly this —
  # its comment claimed 3.3 compatibility it never had, #56.)
  flutter_lints: ">=4.0.0 <7.0.0"
