name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # '' resolves to latest stable; 3.19.6 is the declared minimum
        # floor (pubspec sdk ^3.3.0 / flutter >=3.19.0) — without this
        # leg, a post-3.3 language feature could ship unnoticed (#56).
        flutter-version: ['', '3.19.6']
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version }}
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage
      # Coverage visibility (#60): lcov uploaded as a build artifact from
      # the latest-stable leg. No external coverage service — wiring a
      # Codecov-style badge needs a repo token, tracked in #60.
      - uses: actions/upload-artifact@v4
        if: matrix.flutter-version == ''
        with:
          name: coverage-lcov
          path: coverage/lcov.info

  pana:
    # Score guard for issue #36: dartdoc 9.0.2+ crashes on Windows due to
    # CRLF offsets in Flutter SDK @docImport files
    # (https://github.com/dart-lang/dartdoc/issues/4180), capping local pana at
    # 150/160. pub.dev's scoring runs on Linux where the bug can't reproduce —
    # this job is the authoritative pre-publish score check.
    #
    # pana is pinned: future releases can shift scoring weights or add
    # penalty categories, which would silently change CI pass/fail without
    # any change to this package. Bump explicitly when retesting.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart pub global activate pana 0.23.12
      - run: dart pub global run pana --exit-code-threshold 0
