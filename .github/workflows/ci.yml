name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 'stable' is the latest Dart SDK; 3.3 is the declared minimum
        # floor (pubspec sdk ^3.3.0) — without this leg, a post-3.3
        # language feature could ship unnoticed (#56). Pure-Dart since
        # 0.8.0 (#59): flutter-action replaced by setup-dart.
        sdk: [stable, 3.3.4]
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      # Fast-fail formatter gate, scoped to lib/ — pana's EFFECTIVE scope,
      # established empirically, not from its source: pana 0.23.12's
      # command line formats its whole package copy, but its runs here
      # stay green while 31 test/+tool/ files are nonconforming under the
      # SAME stable SDK (3.13.3), and its one red report named only a
      # lib/ file — so whatever its copy/penalty mechanics, only lib/
      # moves the score, and a `.`-scoped step fails on files the score
      # ignores (proven: run 33503606228 went red on exactly those 31).
      # Stable leg only: formatter output changes across Dart releases —
      # the 3.3 floor leg's formatter disagrees with stable's, and a
      # local stable older than CI's can disagree too. This step is the
      # fast SIGNAL; the ENFORCEMENT half is the required-status-checks
      # branch protection on main (test x2 + pana, set 2026-09-01) — the
      # 2026-08/09 drift was red on pana PRE-merge on every PR and was
      # merged over, so an advisory red X alone would not have prevented
      # it.
      - if: matrix.sdk == 'stable'
        run: dart format --output=none --set-exit-if-changed lib/
      - run: dart analyze --fatal-infos
      - run: dart test
      # Coverage visibility (#60): lcov uploaded as a build artifact from
      # the latest-stable leg, and the line-rate printed to the job summary
      # so the number is visible per-run without downloading the artifact.
      # DECIDED (#60 close-out): no external coverage service — a
      # Codecov-style badge needs a service token; for a personal-use
      # package the per-run summary + artifact trend is enough.
      - if: matrix.sdk == 'stable'
        run: |
          dart pub global activate coverage
          dart pub global run coverage:test_with_coverage
      - name: Coverage summary
        if: matrix.sdk == 'stable'
        run: |
          PCT=$(awk -F, '/^DA:/ {t++; if ($2>0) c++} END {if (t) printf "%.1f", 100*c/t; else print "n/a"}' coverage/lcov.info)
          echo "**Line coverage (stable leg): ${PCT}%**" >> "$GITHUB_STEP_SUMMARY"
          echo "line coverage: ${PCT}%"
      - uses: actions/upload-artifact@v7
        if: matrix.sdk == 'stable'
        with:
          name: coverage-lcov
          path: coverage/lcov.info

  pana:
    # Score guard for issue #36. pub.dev's scoring runs on Linux —
    # this job is the authoritative pre-publish score check.
    #
    # pana is pinned: future releases can shift scoring weights or add
    # penalty categories, which would silently change CI pass/fail without
    # any change to this package. Bump explicitly when retesting.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart pub global activate pana 0.23.12
      - run: dart pub global run pana --exit-code-threshold 0
